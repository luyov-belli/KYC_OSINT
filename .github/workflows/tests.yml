# Integración continua: corre las pruebas sin API en cada push y pull request.
# No usa ANTHROPIC_API_KEY ni gasta tokens.
name: pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias (uv.lock)
        run: uv sync --locked
      - name: Pruebas
        run: uv run pytest -q
