[project]
name = "kyc-osint"
version = "0.1.0"
description = "Borradores de KYC para wealth management en Perú: listas de sanciones, OSINT con Claude y monto tope plausible"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "anthropic>=2.8.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
